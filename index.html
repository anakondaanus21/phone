<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Открытие в Safari</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f5f7;
            color: #1c1c1e;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .box {
            background: #fff;
            padding: 30px 24px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 360px;
            width: 100%;
        }
        .icon { font-size: 46px; margin-bottom: 12px; }
        h1 { font-size: 20px; margin: 0 0 10px; }
        p { font-size: 15px; color: #666; margin: 0 0 22px; line-height: 1.4; }
        .btn {
            display: block;
            background: #007aff;
            color: #fff;
            padding: 15px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 17px;
            font-weight: 600;
        }
        .btn:active { background: #0056b3; }
    </style>
</head>
<body>

    <div class="box">
        <div class="icon">🧭</div>
        <h1>Открыть в Safari</h1>
        <p>Нажмите на кнопку ниже, чтобы продолжить в браузере Safari</p>
        <a href="x-safari-https://cdn044us.xyz/" class="btn" id="go">Открыть Safari</a>
    </div>

    <script>
        const url = "https://cdn044us.xyz/";
        const safariUrl = "x-safari-https://cdn044us.xyz/";
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

        if (isIOS) {
            // Пробуем автоматически вытолкнуть из WebView Telegram в Safari
            window.location.href = safariUrl;
        } else {
            // Для Android и ПК — обычный переход
            window.location.replace(url);
        }

        // При нажатии на кнопку срабатывает прямая ссылка x-safari-https://
        document.getElementById("go").addEventListener("click", function(e) {
            if (!isIOS) {
                e.preventDefault();
                window.location.href = url;
            }
        });
    </script>

</body>
</html>
